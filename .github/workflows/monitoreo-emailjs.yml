
name: Monitoreo EmailJS - Marcelo Seguros

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-emailjs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar errores de EmailJS
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              "user_id": os.environ["EMAILJS_PUBLIC_KEY"],
              "accessToken": os.environ["EMAILJS_PRIVATE_KEY"],
              "page": 1,
              "count": 50,
              "errors_only": "true"
          })

          url = "https://api.emailjs.com/api/v1.1/history?" + params

          request = urllib.request.Request(url)

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)



          
          except Exception as error:
              print("Tipo de error:", type(error).__name__)
              if hasattr(error, "code"):
                  print("Código HTTP:", error.code)
              else:
                  print("Error de conexión o ejecución.")
              raise SystemExit(1)



       

          rows = data.get("rows", [])

          print("Consulta a EmailJS realizada correctamente.")
          print("Registros de error encontrados:", len(rows))
          print("Esta prueba no envia correos.")
          PY
