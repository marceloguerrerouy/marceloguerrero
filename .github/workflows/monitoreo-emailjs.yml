name: Monitoreo EmailJS - Marcelo Seguros

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-emailjs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar errores de EmailJS
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          import urllib.error

          public_key = os.environ.get("EMAILJS_PUBLIC_KEY")
          private_key = os.environ.get("EMAILJS_PRIVATE_KEY")

          if not public_key or not private_key:
              print("ERROR: Faltan claves de EmailJS en GitHub Secrets.")
              raise SystemExit(1)

          params = urllib.parse.urlencode({
              "user_id": public_key,
              "accessToken": private_key,
              "page": 1,
              "count": 50,
              "errors_only": "true"
          })

          url = "https://api.emailjs.com/api/v1.1/history?" + params

          print("Consultando historial de EmailJS...")

          try:
              request = urllib.request.Request(url)

              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)

          except urllib.error.HTTPError as error:
              print("Error HTTP:", error.code)
              print("EmailJS rechazo la consulta.")
              print("No se mostrara el contenido de la respuesta para proteger datos confidenciales.")
              raise SystemExit(1)

          except Exception as error:
              print("Error de conexion o ejecucion:", type(error).__name__)
              raise SystemExit(1)

          rows = data.get("rows", [])

          print("Consulta realizada correctamente.")
          print("Registros devueltos:", len(rows))
          print("Esta prueba no envia correos.")
          PY
